[package]
name = "mit-readiness-atlas"
version = "0.1.0"
description = "Evidence-backed student archetype explorer"
authors = ["MIT Readiness Atlas"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

[lib]
name = "mit_readiness_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
